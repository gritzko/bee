name: Release

on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to test and build the release for"
        required: true

permissions:
  contents: write

# The release ships `bee`: quickjab (github.com/gritzko/quickjab, engine =
# vendored quickjs-ng) built with THIS rev packed in as its default jsrc
# floor, so one executable works against plain git repos with no checkout.
# No JSC and no ICU anywhere in the matrix, so the static leg caches nothing.
# Every build goes through .github/build-bee.sh — the shipped build is the
# tested build.  `test` gates the whole run on the bundled test/*/run.sh
# suites, which quickjab registers as ctest JSRC* when it packs this tree.
jobs:
  # The gate: no tarball and no binary is published if the suites are red.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build \
            libsodium-dev libcurl4-gnutls-dev liblz4-dev zlib1g-dev

      - name: Build bee (quickjab + packed jsrc)
        run: sh .github/build-bee.sh

      - name: Bundled suites
        run: ctest --test-dir qj-build -R '^JSRC' --output-on-failure

      - name: Smoke test the packed bee
        run: sh .github/smoke-bee.sh qj-build/bin/bee

  # The source tarball of this jsrc tree; also creates the release object the
  # binary jobs upload into.
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Pack tarball
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="bee-${TAG}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            bee-*.tar.gz
            bee-*.tar.gz.sha256

  # The dynamically linked `bee` per platform.  The suites run here too, so a
  # macOS- or arm64-only regression cannot ship.
  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bee-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: bee-linux-arm64
          - os: macos-latest
            asset: bee-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build \
            libsodium-dev libcurl4-gnutls-dev liblz4-dev zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake libsodium lz4

      - name: Build bee (quickjab + packed jsrc)
        run: sh .github/build-bee.sh

      - name: Bundled suites
        run: ctest --test-dir qj-build -R '^JSRC' --output-on-failure

      - name: Smoke test the packed bee
        run: sh .github/smoke-bee.sh qj-build/bin/bee

      - name: Pack
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${{ matrix.asset }}-${TAG}"
          install -d "dist/${NAME}"
          install -m 0755 qj-build/bin/bee "dist/${NAME}/bee"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.asset }}-*.tar.gz
            ${{ matrix.asset }}-*.tar.gz.sha256

  # musl-static x86_64: one binary for ANY Linux, glibc or not.  Only the
  # floor smoke runs here — the suites are already gated on glibc, and busybox
  # is not the shell they are written against.
  static:
    needs: release
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - name: Container prerequisites for checkout
        run: apk add -q git tar

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # checkout writes its safe.directory exception into a temporary HOME the
      # container shell never sees, so set it where the build will read it.
      - name: Mark checkout safe for container git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build static bee
        run: sh .github/build-static.sh "$PWD/bee-static"

      - name: Pack and upload
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="bee-linux-x86_64-static-${TAG}"
          install -d "dist/${NAME}"
          install -m 0755 bee-static "dist/${NAME}/bee"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            bee-linux-x86_64-static-*.tar.gz
            bee-linux-x86_64-static-*.tar.gz.sha256
