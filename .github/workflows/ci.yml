name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Same build as the release: `bee` is quickjab (github.com/gritzko/quickjab,
# engine = vendored quickjs-ng) with THIS tree packed in as its default jsrc
# floor, so what CI exercises is the artifact users get.  No JSC, no ICU.
# The bundled test/*/run.sh suites come back as ctest JSRC* once packed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build \
            libsodium-dev libcurl4-gnutls-dev liblz4-dev zlib1g-dev

      - name: Build bee (quickjab + packed jsrc)
        run: sh .github/build-bee.sh

      - name: Bundled suites
        run: ctest --test-dir qj-build -R '^JSRC' --output-on-failure

      - name: Smoke test the packed bee
        run: sh .github/smoke-bee.sh qj-build/bin/bee
